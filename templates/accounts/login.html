{% extends 'base.html' %}

{% block title %}Sign In - Chronicle{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/80 shadow-sm">
        <div class="text-center mb-8">
            <span class="w-12 h-12 rounded-2xl bg-brand-600 text-white inline-flex items-center justify-center font-extrabold text-2xl shadow-sm shadow-brand-500/30 mb-4">
                C
            </span>
            <h1 class="text-2xl font-extrabold text-slate-900">Welcome Back</h1>
            <p class="text-sm text-slate-500 mt-1">
                Sign in to manage your stories, like, and comment.
            </p>
        </div>

        <form method="POST" novalidate class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-slate-800"
                    placeholder="Your username"
                >
            </div>

            <div>
                <label for="id_password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                    autocomplete="current-password"
                    class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-slate-800"
                    placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                >
            </div>

            <button type="submit" class="w-full mt-2 py-3 px-4 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 shadow-sm transition">
                Sign In
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-600">
                Don't have an account yet?
                <a href="{% url 'accounts:register' %}" class="font-bold text-brand-600 hover:text-brand-700 transition ml-1">
                    Sign up
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
