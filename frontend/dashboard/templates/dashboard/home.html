<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyGuard AI - Intelligent Compliance</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            box-sizing: border-box;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 20px;
        }

        .brand-icon {
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 900;
            margin: 0 0 24px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 800px;
            line-height: 1.1;
        }

        .hero p {
            font-size: 20px;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 0 40px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
        }

        .hero-btn {
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-start {
            background: #ffffff;
            color: #0f172a;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }

        .btn-learn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-learn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <span class="brand-icon">🛡</span>
            PolicyGuard AI
        </div>
        <div class="nav-links">
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'signup' %}" class="btn-primary">Sign up</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Intelligent Policy Compliance for Modern Teams</h1>
        <p>Automate compliance checks, chat with your documents, and resolve policy evaluations instantly using secure AI.</p>
        
        <div class="hero-buttons">
            <a href="{% url 'signup' %}" class="hero-btn btn-start">Get Started</a>
            <a href="{% url 'login' %}" class="hero-btn btn-learn">Sign In</a>
        </div>
    </div>

</body>
</html>
